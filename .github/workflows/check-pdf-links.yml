name: Check score PDF links

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check published PDFs for LilyPond source links
        run: python3 build_pdfs.py --check
